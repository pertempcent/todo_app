name: Flutter CI

on:
  push:
    branches:
      - feature/task-setup
  pull_request:
    branches:
      - feature/task-setup

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'  

    - name: Install dependencies
      run: flutter pub get
